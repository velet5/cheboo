name: Cheboo
options:
  bundleIdPrefix: com.github.velet5
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Cheboo:
    type: application
    platform: macOS
    sources:
      - path: Cheboo
        excludes:
          - "**/.DS_Store"
    info:
      path: Cheboo/Info.plist
      properties:
        CFBundleName: Cheboo
        CFBundleDisplayName: Cheboo
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSMicrophoneUsageDescription: "Cheboo captures your microphone while you hold the dictation hotkey, streams it to Deepgram for transcription, and types the result into whatever app is focused."
        NSHumanReadableCopyright: "© 2026 velet5"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          # Let the Whisper server engine reach a local whisper.cpp / faster-whisper
          # process over plain HTTP. Public TLS endpoints (Deepgram, OpenAI) stay
          # subject to normal ATS.
          NSAllowsLocalNetworking: true
    entitlements:
      path: Cheboo/Cheboo.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.velet5.cheboo
        PRODUCT_NAME: Cheboo
        INFOPLIST_KEY_LSUIElement: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Cheboo/Cheboo-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
